[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aztecdefects"
version = "1.0.0"
description = "Exact computations for diagonal defect tiles in Aztec-diamond dimer coverings"
authors = [{name = "Changyeon Won", email = "cywon@khu.ac.kr"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "sympy", "python-flint", "matplotlib", "networkx"]

[tool.setuptools]
packages = ["aztecdefects"]

[tool.pytest.ini_options]
pythonpath = ["."]
